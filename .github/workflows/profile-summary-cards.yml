name: GitHub Profile Summary Cards

on:
  schedule:
    - cron: "0 0 * * *" # 
  workflow_dispatch: # 

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-summary-cards
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - uses: vn7n24f113/github-profile-summary-cards@v0.8.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: blackbird7x413
          THEME: 2077 # 
